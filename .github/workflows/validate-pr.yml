name: Validate website PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CV PDF renderer
        run: python3 -m pip install weasyprint==68.0
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check src/lib/site.mjs
          node --check public/site-analytics.js
          node --check public/intake.js
          node --check public/lifecycle.js
          node --check scripts/check-release.mjs
      - name: Build Astro
        run: npm run build
      - name: Verify generated routes, data layer and privacy
        run: node scripts/check-release.mjs
      - name: Install Chromium browser test dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Check hero viewport and lifecycle interaction
        run: python3 scripts/check-responsive.py
      - name: Upload mobile and desktop QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-check
          path: artifacts/layout/
          if-no-files-found: ignore

